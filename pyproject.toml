
[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "fastgc"
version = "0.2.1"
description = "FAST-GC: Fully Adaptive Self-Tuning Sensor-Agnostic Ground Classification for LiDAR point clouds"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "AGPL-3.0-or-later" }

authors = [
  { name = "Nadeem Fareed" }
]

keywords = [
  "lidar",
  "point-cloud",
  "ground-classification",
  "dem",
  "dsm",
  "chm",
  "terrain",
  "als",
  "uls",
  "tls",
  "itd"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

# Runtime dependency contract for Python 3.12-3.14.
# Isolation is provided by the installer/environment (venv, pipx, Conda),
# not by pip itself.
# Pyogrio replaces Fiona for bulk vector I/O and Python 3.14 wheel
# compatibility.
dependencies = [
  "numpy>=2.0,<3.0",
  "scipy>=1.15,<2.0",
  "laspy>=2.5.4,<3.0",
  "lazrs>=0.7,<1.0",
  "rasterio>=1.5,<2.0",
  "pyproj>=3.7,<4",
  "pyogrio>=0.13,<1.0",
  "geopandas>=1.0,<2.0",
  "shapely>=2.0.6,<3.0",
  "tqdm>=4.66,<5.0",
  "joblib>=1.4,<2.0",
  "psutil>=6.0,<8.0",
  "packaging>=24.2,<27.0"
]

[project.urls]
Homepage = "https://github.com/nadeemfareed/FAST-GC"
Repository = "https://github.com/nadeemfareed/FAST-GC"
Issues = "https://github.com/nadeemfareed/FAST-GC/issues"

[project.optional-dependencies]

# Optional ML integration. Kept outside the core installation to avoid
# CUDA/CPU resolver conflicts and allow users to select the appropriate
# PyTorch wheel for their hardware.
ml = [
  "scikit-learn>=1.6,<2.0",
  "torch>=2.7,<3.0"
]

# Optional scientific visualization.
viz = [
  "matplotlib>=3.9,<4.0",
  "plotly>=6.0,<7.0"
]

# Optional Jupyter Notebook and JupyterLab integration.
# FAST-GC processing remains accessible through the published CLI.
# These dependencies are not required for standard CLI processing.
notebook = [
  "ipykernel>=6.29,<8.0",
  "jupyterlab>=4.0,<5.0",
  "matplotlib>=3.9,<4.0",
  "plotly>=6.0,<7.0"
]

# Development, testing, linting, and packaging tools.
dev = [
  "build>=1.2",
  "twine>=6.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "black>=25.0",
  "pre-commit>=4.0",
  "packaging>=24.2"
]

# Complete optional environment: ML, visualization, notebooks,
# and development tools.
# PyTorch remains subject to platform-specific CPU/CUDA selection.
all = [
  "scikit-learn>=1.6,<2.0",
  "torch>=2.7,<3.0",
  "matplotlib>=3.9,<4.0",
  "plotly>=6.0,<7.0",
  "ipykernel>=6.29,<8.0",
  "jupyterlab>=4.0,<5.0",
  "build>=1.2",
  "twine>=6.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "black>=25.0",
  "pre-commit>=4.0",
  "packaging>=24.2"
]

[project.scripts]
fastgc = "fastgc.cli:main"
fastgc-check = "fastgc.check_env:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

# FASTGC_UNIFIED_MATURIN_V1
[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "fastgc._fastgc_native"
bindings = "pyo3"
include = [
  { path = "LICENSE", format = "sdist" }
]
