name: fastgc

channels:
  - conda-forge

channel_priority: strict

dependencies:
  - python>=3.12,<3.15
  - pip>=25
  - setuptools>=75
  - wheel>=0.44
  - numpy>=2.0,<3.0
  - scipy>=1.15,<2.0
  - laspy>=2.5.4,<3.0
  - lazrs>=0.7,<1.0
  - rasterio>=1.5,<2.0
  - pyogrio>=0.13,<1.0
  - shapely>=2.0.6,<3.0
  - tqdm>=4.66,<5.0
  - joblib>=1.4,<2.0
  - psutil>=6.0,<8.0
  - packaging>=24.2,<27.0
  - pip:
      # Install this checkout in editable mode without resolving a second copy
      # of the dependencies already created inside the isolated Conda env.
      - -e . --no-deps
